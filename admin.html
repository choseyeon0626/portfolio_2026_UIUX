<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cho Seyeon Portfolio</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#020202;--ink:#fff;--muted:rgba(255,255,255,0.55);
  --line:rgba(255,255,255,0.14);--blue:#4a7dff;
  --font:"Helvetica Neue",Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh}

/* ── Login Screen ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:24px;padding:40px;
}
.login-box{
  background:rgba(255,255,255,0.04);border:1px solid var(--line);
  border-radius:12px;padding:40px;text-align:center;max-width:380px;width:100%;
}
.login-box h1{font-size:20px;font-weight:600;margin-bottom:8px;letter-spacing:-0.02em}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.7}
.google-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:#fff;color:#333;border:none;border-radius:8px;
  padding:14px 24px;font-size:14px;font-weight:600;cursor:pointer;
  width:100%;transition:opacity 0.2s;font-family:var(--font);
}
.google-btn:hover{opacity:0.9}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
.login-error{
  margin-top:16px;color:#ff6b6b;font-size:13px;display:none;
  background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);
  border-radius:6px;padding:10px 14px;
}

/* ── Loading ── */
#loading-screen{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:16px;color:var(--muted);font-size:14px;
}
.spinner{
  width:36px;height:36px;border:3px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Admin Panel ── */
#admin-screen{display:none;min-height:100vh}

.admin-header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:rgba(2,2,2,0.9);
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
}
.admin-header-left{display:flex;align-items:center;gap:14px}
.admin-logo{font-size:13px;font-weight:700;letter-spacing:0.06em;color:#fff}
.admin-badge{
  font-size:10px;background:var(--blue);color:#fff;
  padding:3px 8px;border-radius:3px;letter-spacing:0.06em;font-weight:700;
}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
  background:var(--line);object-fit:cover;
}
.user-email{font-size:12px;color:var(--muted)}
.logout-btn{
  background:none;border:1px solid var(--line);color:var(--muted);
  font-size:11px;padding:5px 12px;cursor:pointer;border-radius:4px;
  font-family:var(--font);transition:all 0.2s;
}
.logout-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.back-to-site{
  font-size:12px;color:var(--blue);text-decoration:none;
  display:flex;align-items:center;gap:4px;transition:opacity 0.2s;
}
.back-to-site:hover{opacity:0.7}

.admin-body{max-width:1100px;margin:0 auto;padding:32px 28px}

/* ── Sections ── */
.admin-section{margin-bottom:48px}
.admin-section-title{
  font-size:11px;font-weight:700;letter-spacing:0.12em;
  color:var(--muted);text-transform:uppercase;margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}

/* ── Item Grid ── */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item-card{
  background:rgba(255,255,255,0.04);border:1px solid var(--line);
  border-radius:8px;padding:16px;cursor:pointer;transition:all 0.15s;
  position:relative;
}
.item-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25)}
.item-card-label{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px}
.item-card-caption{font-size:12px;color:var(--muted);line-height:1.5}
.item-card-thumb{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;
  margin-bottom:10px;background:rgba(255,255,255,0.06);
}
.add-card{
  border-style:dashed;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:13px;min-height:100px;
}
.add-card:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.add-icon{font-size:24px;font-weight:300}

/* ── Edit Panel ── */
#edit-panel{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;padding:20px;
}
.edit-modal{
  background:#111;border:1px solid var(--line);border-radius:12px;
  width:min(760px,100%);max-height:90vh;overflow-y:auto;
  padding:32px;
}
.edit-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.edit-modal-title{font-size:16px;font-weight:600}
.close-edit-btn{
  background:none;border:none;color:var(--muted);font-size:22px;
  cursor:pointer;padding:4px;line-height:1;transition:color 0.2s;
}
.close-edit-btn:hover{color:#fff}
.edit-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:0.04em}
input,textarea,select{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--line);
  color:#fff;font-family:var(--font);font-size:13px;border-radius:6px;
  padding:10px 12px;outline:none;transition:border-color 0.2s;
}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
select option{background:#222;color:#fff}
textarea{resize:vertical;min-height:90px}

/* ── Upload Zone ── */
.upload-zone{
  border:1px dashed var(--line);border-radius:6px;padding:24px;
  text-align:center;cursor:pointer;transition:all 0.15s;
  color:var(--muted);font-size:13px;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);color:#fff;background:rgba(74,125,255,0.06)}
.upload-zone small{display:block;margin-top:6px;font-size:11px;opacity:0.6}
.upload-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.upload-preview-item{position:relative;width:72px;height:72px}
.upload-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.del-btn{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;
  background:#e87070;border:none;border-radius:50%;color:#fff;
  font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.file-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,0.04);border:1px solid var(--line);
  border-radius:5px;font-size:12px;color:var(--muted);position:relative;
}

/* ── Buttons ── */
.btn{
  background:rgba(255,255,255,0.08);border:1px solid var(--line);
  color:#fff;font-family:var(--font);font-size:13px;
  padding:10px 20px;border-radius:6px;cursor:pointer;transition:all 0.15s;
}
.btn:hover{background:rgba(255,255,255,0.14)}
.btn--primary{background:var(--blue);border-color:var(--blue)}
.btn--primary:hover{background:#3a6de0}
.btn--danger{background:rgba(232,112,112,0.15);border-color:rgba(232,112,112,0.3);color:#e87070}
.btn--danger:hover{background:rgba(232,112,112,0.25)}
.edit-actions{
  display:flex;gap:10px;justify-content:flex-end;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;
}
.save-success{
  color:#6fcf97;font-size:13px;display:none;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Sort View ── */
#sort-panel{display:none;margin-bottom:24px}
.sort-list{display:flex;flex-direction:column;gap:6px;max-width:500px}
.sort-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(255,255,255,0.04);border:1px solid var(--line);
  border-radius:6px;cursor:grab;transition:background 0.15s;user-select:none;
}
.sort-item:hover{background:rgba(255,255,255,0.08)}
.sort-item.dragging{opacity:0.5;border-style:dashed}
.sort-item.drag-over{border-color:var(--blue);background:rgba(74,125,255,0.1)}
.sort-handle{color:var(--muted);font-size:16px;cursor:grab}
.sort-label{font-size:13px;color:#fff}

/* ── PW Change ── */
#pw-panel{display:none;max-width:360px}
.pw-form{display:flex;flex-direction:column;gap:12px}
.pw-error{color:#e87070;font-size:12px;display:none;margin-top:4px}
.pw-success{color:#6fcf97;font-size:12px;display:none;margin-top:4px}
</style>
</head>

/* ══════════════════════════════════════════════
   FIREBASE DB HELPERS
══════════════════════════════════════════════ */
async function dbGet(path) {
  try {
    const res = await fetch(FIREBASE_DB + path + '.json');
    return res.ok ? await res.json() : null;
  } catch { return null; }
}
async function dbSet(path, data) {
  try {
    await fetch(FIREBASE_DB + path + '.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
  } catch(e) { console.error('Firebase 오류:', e); }
}

/* ══════════════════════════════════════════════
   CLOUDINARY UPLOAD
══════════════════════════════════════════════ */
function uploadToCloudinary(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/auto/upload', true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          const json = JSON.parse(xhr.responseText);
          resolve({ name: file.name, type: file.type, data: json.secure_url });
        } catch(e) { reject(new Error('파싱 실패')); }
      } else { reject(new Error('업로드 실패: ' + xhr.status)); }
    };
    xhr.onerror = () => reject(new Error('네트워크 오류'));
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    fd.append('folder', 'portfolio');
    xhr.send(fd);
  });
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ name: file.name, type: file.type, data: r.result });
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ══════════════════════════════════════════════
   LOAD DATA
══════════════════════════════════════════════ */
async function loadAllData() {
  try {
    const savedPw = await dbGet('/config/password');
    if (savedPw && typeof savedPw === 'string') ADMIN_PW = savedPw;

    const savedOrder = await dbGet('/config/order');
    if (Array.isArray(savedOrder) && savedOrder.length > 0) KEYS = savedOrder;

    const remote = await dbGet('/portfolio');
    const remoteKeys = remote ? Object.keys(remote) : [];
    const merged = [...new Set([...KEYS, ...remoteKeys])];
    const data = {};
    for (const key of merged) {
      if (remote && remote[key]) {
        data[key] = remote[key];
        if (!KEYS.includes(key)) KEYS.push(key);
      } else if (DEFAULT_DATA[key]) {
        data[key] = JSON.parse(JSON.stringify(DEFAULT_DATA[key]));
      }
    }
    return data;
  } catch(e) {
    console.error('loadAllData 오류:', e);
    const data = {};
    for (const key of KEYS) {
      if (DEFAULT_DATA[key]) data[key] = JSON.parse(JSON.stringify(DEFAULT_DATA[key]));
    }
    return data;
  }
}

/* ══════════════════════════════════════════════
   RENDER ITEM GRID
══════════════════════════════════════════════ */
function renderItemGrid() {
  const grid = document.getElementById('item-grid');
  grid.innerHTML = '';
  KEYS.forEach(key => {
    const d = allData[key]; if (!d) return;
    const card = document.createElement('div');
    card.className = 'item-card';
    const imgs = (d.files||[]).filter(f => f.type && f.type.startsWith('image/'));
    card.innerHTML = `
      ${imgs.length > 0 ? `<img class="item-card-thumb" src="${imgs[0].data}" alt="">` : ''}
      <div class="item-card-label">${(d.label||'').replace(/\n/g,' ')}</div>
      <div class="item-card-caption">${d.caption||''}</div>
    `;
    card.onclick = () => openEditPanel(key);
    grid.appendChild(card);
  });
  // + 새 항목 추가 카드
  const addCard = document.createElement('div');
  addCard.className = 'item-card add-card';
  addCard.innerHTML = '<span class="add-icon">+</span><span>새 항목 추가</span>';
  addCard.onclick = () => {
    const key = 'item_' + Date.now();
    KEYS.push(key);
    allData[key] = {
      label:'NEW\nITEM', caption:'새 포트폴리오 항목', tag:'', title:'새 포트폴리오',
      desc:'', type:'', role:'', year:'2024', color:'work-thumb--warm', files:[]
    };
    renderItemGrid();
    openEditPanel(key);
  };
  grid.appendChild(addCard);
}

/* ══════════════════════════════════════════════
   EDIT PANEL
══════════════════════════════════════════════ */
function openEditPanel(key) {
  editingKey = key;
  const d = allData[key];
  document.getElementById('edit-panel-title').textContent = '편집: ' + (d.label||'').replace(/\n/g,' ');
  document.getElementById('f-label').value   = d.label   || '';
  document.getElementById('f-caption').value = d.caption || '';
  document.getElementById('f-tag').value     = d.tag     || '';
  document.getElementById('f-year').value    = d.year    || '';
  document.getElementById('f-role').value    = d.role    || '';
  document.getElementById('f-type').value    = d.type    || '';
  document.getElementById('f-desc').value    = d.desc    || '';
  document.getElementById('f-color').value   = d.color   || 'work-thumb--warm';
  pendingFiles = JSON.parse(JSON.stringify(d.files || []));
  document.getElementById('save-success').style.display = 'none';
  renderUploadPreview();
  document.getElementById('edit-panel').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeEditPanel() {
  document.getElementById('edit-panel').style.display = 'none';
  document.body.style.overflow = '';
  editingKey = null;
}

function renderUploadPreview() {
  const preview = document.getElementById('upload-preview');
  preview.innerHTML = '';
  pendingFiles.forEach((f, i) => {
    if (f.type && f.type.startsWith('image/')) {
      const wrap = document.createElement('div');
      wrap.className = 'upload-preview-item';
      wrap.innerHTML = `<img src="${f.data}" alt="${f.name}"><button class="del-btn" data-i="${i}">✕</button>`;
      preview.appendChild(wrap);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'file-item';
      const color = f.type && f.type.startsWith('video/') ? '#6fa0ff' : '#e87070';
      const label = f.type && f.type.startsWith('video/') ? '▶ MP4' : 'PDF';
      wrap.innerHTML = `<span style="color:${color};font-weight:700;font-size:11px">${label}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span><button class="del-btn" style="position:static;margin-left:auto" data-i="${i}">✕</button>`;
      preview.appendChild(wrap);
    }
  });
  preview.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      pendingFiles.splice(Number(btn.dataset.i), 1);
      renderUploadPreview();
    };
  });
}

async function addFiles(files) {
  const saveBtn = document.getElementById('save-btn');
  const origTxt = saveBtn.textContent;
  saveBtn.disabled = true; saveBtn.textContent = '업로드 중...';
  for (const file of files) {
    if (!file.type.startsWith('image/') && file.type !== 'application/pdf' && !file.type.startsWith('video/')) continue;
    try {
      pendingFiles.push(await uploadToCloudinary(file));
    } catch(e) {
      console.error('Cloudinary 실패, base64 대체:', e);
      pendingFiles.push(await fileToBase64(file));
    }
  }
  saveBtn.disabled = false; saveBtn.textContent = origTxt;
  renderUploadPreview();
}

const uploadZone = document.getElementById('upload-zone');
const fileInput  = document.getElementById('file-input');
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', async e => { e.preventDefault(); uploadZone.classList.remove('drag'); await addFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', async () => { await addFiles([...fileInput.files]); fileInput.value=''; });

document.getElementById('close-edit-btn').addEventListener('click', closeEditPanel);
document.getElementById('cancel-edit-btn').addEventListener('click', closeEditPanel);
document.getElementById('edit-panel').addEventListener('click', e => { if (e.target === document.getElementById('edit-panel')) closeEditPanel(); });

document.getElementById('save-btn').addEventListener('click', async () => {
  const key = editingKey; if (!key) return;
  const item = {
    label:   document.getElementById('f-label').value,
    caption: document.getElementById('f-caption').value,
    tag:     document.getElementById('f-tag').value,
    title:   document.getElementById('f-label').value.replace(/\n/g,' '),
    year:    document.getElementById('f-year').value,
    role:    document.getElementById('f-role').value,
    type:    document.getElementById('f-type').value,
    desc:    document.getElementById('f-desc').value,
    color:   document.getElementById('f-color').value,
    files:   pendingFiles,
  };
  allData[key] = item;
  await dbSet('/portfolio/' + key, item);
  await dbSet('/config/order', KEYS);
  document.getElementById('save-success').style.display = 'block';
  setTimeout(() => {
    document.getElementById('save-success').style.display = 'none';
    closeEditPanel();
    renderItemGrid();
  }, 1200);
});

document.getElementById('delete-item-btn').addEventListener('click', async () => {
  const key = editingKey; if (!key) return;
  if (!confirm('이 항목을 삭제할까요?')) return;
  await fetch(FIREBASE_DB + '/portfolio/' + key + '.json', { method: 'DELETE' });
  KEYS = KEYS.filter(k => k !== key);
  delete allData[key];
  await dbSet('/config/order', KEYS);
  closeEditPanel();
  renderItemGrid();
});

/* ══════════════════════════════════════════════
   SORT
══════════════════════════════════════════════ */
let sortVisible = false;
document.getElementById('sort-toggle-btn').addEventListener('click', () => {
  sortVisible = !sortVisible;
  document.getElementById('sort-panel').style.display = sortVisible ? 'block' : 'none';
  if (sortVisible) renderSortList();
});
document.getElementById('sort-cancel-btn').addEventListener('click', () => {
  sortVisible = false;
  document.getElementById('sort-panel').style.display = 'none';
});
document.getElementById('sort-save-btn').addEventListener('click', async () => {
  await dbSet('/config/order', KEYS);
  renderItemGrid();
  const suc = document.getElementById('sort-success');
  suc.style.display = 'block';
  setTimeout(() => { suc.style.display='none'; sortVisible=false; document.getElementById('sort-panel').style.display='none'; }, 1400);
});

function renderSortList() {
  const list = document.getElementById('sort-list');
  list.innerHTML = '';
  KEYS.forEach(key => {
    const d = allData[key]; if (!d) return;
    const item = document.createElement('div');
    item.className = 'sort-item';
    item.draggable = true;
    item.dataset.key = key;
    item.innerHTML = `<span class="sort-handle">⠿</span><span class="sort-label">${(d.label||key).replace(/\n/,' ')}</span>`;
    item.addEventListener('dragstart', e => { dragSrcKey = key; item.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); list.querySelectorAll('.sort-item').forEach(c=>c.classList.remove('drag-over')); });
    item.addEventListener('dragover', e => { e.preventDefault(); list.querySelectorAll('.sort-item').forEach(c=>c.classList.remove('drag-over')); if (dragSrcKey!==key) item.classList.add('drag-over'); });
    item.addEventListener('drop', e => {
      e.preventDefault(); item.classList.remove('drag-over');
      if (!dragSrcKey || dragSrcKey===key) return;
      const fi = KEYS.indexOf(dragSrcKey), ti = KEYS.indexOf(key);
      if (fi<0||ti<0) return;
      KEYS.splice(fi,1); KEYS.splice(ti,0,dragSrcKey);
      renderSortList();
    });
    list.appendChild(item);
  });
}

  const cur = document.getElementById('pw-current').value;
  const nw  = document.getElementById('pw-new').value;
  const con = document.getElementById('pw-confirm').value;
  const err = document.getElementById('pw-error');
  const suc = document.getElementById('pw-success');
  err.style.display='none'; suc.style.display='none';

});

/* ══════════════════════════════════════════════
   GOOGLE AUTH
══════════════════════════════════════════════ */
function showLoading() {
  document.getElementById('loading-screen').style.display = 'flex';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'none';
}
function showLogin(errorMsg) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  if (errorMsg) {
    const el = document.getElementById('login-error');
    el.textContent = errorMsg;
    el.style.display = 'block';
  }
}
function showAdmin(user) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('user-email').textContent = user.email;
  if (user.photoURL) document.getElementById('user-avatar').src = user.photoURL;
}

document.getElementById('google-login-btn').addEventListener('click', async () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ login_hint: ALLOWED_EMAIL });
  try {
    const result = await auth.signInWithPopup(provider);
    const email = result.user.email;
    if (email !== ALLOWED_EMAIL) {
      await auth.signOut();
      showLogin('접근 권한이 없는 계정입니다. (' + email + ')');
    }
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      showLogin('로그인 중 오류가 발생했습니다: ' + e.message);
    }
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await auth.signOut();
});

auth.onAuthStateChanged(async user => {
  if (!user) { showLogin(); return; }
  if (user.email !== ALLOWED_EMAIL) {
    await auth.signOut();
    showLogin('접근 권한이 없는 계정입니다.');
    return;
  }
  showLoading();
  allData = await loadAllData();
  showAdmin(user);
  renderItemGrid();
});

/* 초기 로딩 */
showLoading();
</script>
